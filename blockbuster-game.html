<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW WARRIOR - Epic Platformer Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', Arial, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 1200px;
            height: 700px;
        }

        canvas {
            border: 5px solid #00ffff;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
            display: block;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
            pointer-events: none;
        }

        .hud-section {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #00ffff;
        }

        .health-bar {
            width: 200px;
            height: 25px;
            background: #333;
            border: 2px solid #00ffff;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6600, #00ff00);
            transition: width 0.3s;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #menu.hidden {
            display: none;
        }

        h1 {
            font-size: 72px;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff;
            margin-bottom: 30px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 30px #00ffff; }
            50% { text-shadow: 0 0 60px #00ffff, 0 0 90px #00ffff; }
        }

        .menu-text {
            font-size: 24px;
            color: #fff;
            margin: 20px 0;
            text-align: center;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, #00ffff, #0080ff);
            border: none;
            color: #000;
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 255, 255, 0.8);
        }

        #upgrade-shop {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #00ffff;
            padding: 40px;
            border-radius: 20px;
            display: none;
            z-index: 200;
            max-width: 800px;
        }

        #upgrade-shop.active {
            display: block;
        }

        .upgrade-title {
            font-size: 48px;
            color: #00ffff;
            text-align: center;
            margin-bottom: 30px;
        }

        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .upgrade-item {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            padding: 20px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upgrade-item:hover {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .upgrade-item.purchased {
            background: rgba(0, 255, 0, 0.2);
            border-color: #00ff00;
            cursor: default;
        }

        .upgrade-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .upgrade-cost {
            font-size: 20px;
            color: #ffd700;
        }

        #level-complete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #00ff00;
            padding: 50px;
            border-radius: 20px;
            display: none;
            z-index: 200;
            text-align: center;
        }

        #level-complete.active {
            display: block;
        }

        .complete-title {
            font-size: 64px;
            color: #00ff00;
            margin-bottom: 20px;
            text-shadow: 0 0 30px #00ff00;
        }

        .complete-stats {
            font-size: 24px;
            color: white;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas" width="1200" height="700"></canvas>

        <div id="hud">
            <div class="hud-section">
                <div>LEVEL: <span id="levelNum">1</span></div>
                <div>HEALTH: <span id="health">100</span></div>
                <div class="health-bar">
                    <div class="health-fill" id="healthBar" style="width: 100%;"></div>
                </div>
            </div>
            <div class="hud-section">
                <div>COINS: <span id="coins">0</span></div>
                <div>SCORE: <span id="score">0</span></div>
                <div>KILLS: <span id="kills">0</span></div>
            </div>
        </div>

        <div id="menu">
            <h1>⚔️ SHADOW WARRIOR ⚔️</h1>
            <div class="menu-text">
                Arrow Keys = Move & Jump<br>
                SPACE = Attack<br>
                S = Shop (spend coins on upgrades!)
            </div>
            <button class="btn" onclick="startGame()">START GAME</button>
            <button class="btn" onclick="showUpgradeShop()">UPGRADES</button>
        </div>

        <div id="upgrade-shop">
            <div class="upgrade-title">⚡ UPGRADE SHOP ⚡</div>
            <div class="upgrade-grid" id="upgradeGrid"></div>
            <button class="btn" onclick="closeUpgradeShop()" style="margin-top: 30px; display: block; margin-left: auto; margin-right: auto;">CLOSE</button>
        </div>

        <div id="level-complete">
            <div class="complete-title">🏆 LEVEL COMPLETE! 🏆</div>
            <div class="complete-stats" id="levelStats"></div>
            <button class="btn" onclick="nextLevel()">NEXT LEVEL</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameRunning = false;
        let currentLevel = 1;
        let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;
        let score = 0;
        let kills = 0;

        // Player
        const player = {
            x: 100,
            y: 500,
            width: 40,
            height: 50,
            vx: 0,
            vy: 0,
            speed: 6,
            jumpPower: 16,
            health: 100,
            maxHealth: 100,
            onGround: false,
            facing: 1,
            attacking: false,
            attackTimer: 0,
            invincible: false,
            invincibleTimer: 0,
            doubleJump: false,
            hasDoubleJump: false,
            canDoubleJump: false
        };

        // Upgrades
        const upgrades = {
            maxHealth: { name: 'Max Health +50', cost: 100, purchased: false, apply: () => { player.maxHealth += 50; player.health = player.maxHealth; } },
            attackSpeed: { name: 'Attack Speed', cost: 150, purchased: false },
            moveSpeed: { name: 'Move Speed', cost: 200, purchased: false, apply: () => { player.speed += 2; } },
            doubleJump: { name: 'Double Jump', cost: 250, purchased: false, apply: () => { player.hasDoubleJump = true; } },
            strongerAttack: { name: 'Stronger Attacks', cost: 300, purchased: false },
            shield: { name: 'Shield (Start with 50% more HP)', cost: 400, purchased: false }
        };

        // Load upgrades
        const savedUpgrades = localStorage.getItem('upgrades');
        if (savedUpgrades) {
            const saved = JSON.parse(savedUpgrades);
            Object.keys(saved).forEach(key => {
                if (saved[key].purchased && upgrades[key]) {
                    upgrades[key].purchased = true;
                    if (upgrades[key].apply) upgrades[key].apply();
                }
            });
        }

        // Game objects
        let platforms = [];
        let enemies = [];
        let coins = [];
        let particles = [];
        let projectiles = [];
        let boss = null;

        // Controls
        const keys = {};
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space' && gameRunning) {
                e.preventDefault();
                attack();
            }
            if (e.code === 'KeyS' && gameRunning) {
                e.preventDefault();
                toggleUpgradeShop();
            }
        });
        document.addEventListener('keyup', e => keys[e.code] = false);

        function startGame() {
            gameRunning = true;
            currentLevel = 1;
            score = 0;
            kills = 0;

            // Apply shield upgrade
            if (upgrades.shield.purchased) {
                player.maxHealth = 150;
                player.health = 150;
            } else {
                player.maxHealth = upgrades.maxHealth.purchased ? 150 : 100;
                player.health = player.maxHealth;
            }

            document.getElementById('menu').classList.add('hidden');
            loadLevel(currentLevel);
            gameLoop();
        }

        function loadLevel(level) {
            player.x = 100;
            player.y = 500;
            player.vx = 0;
            player.vy = 0;

            platforms = [];
            enemies = [];
            coins = [];
            projectiles = [];
            boss = null;

            // Create platforms
            platforms.push({ x: 0, y: 650, width: 1200, height: 50, color: '#2ecc71' });
            platforms.push({ x: 200, y: 500, width: 200, height: 20, color: '#3498db' });
            platforms.push({ x: 500, y: 400, width: 200, height: 20, color: '#3498db' });
            platforms.push({ x: 800, y: 300, width: 200, height: 20, color: '#3498db' });
            platforms.push({ x: 300, y: 250, width: 150, height: 20, color: '#3498db' });
            platforms.push({ x: 600, y: 550, width: 150, height: 20, color: '#3498db' });

            // Spawn enemies based on level
            const enemyCount = 3 + level * 2;
            for (let i = 0; i < enemyCount; i++) {
                const platform = platforms[Math.floor(Math.random() * (platforms.length - 1)) + 1];
                enemies.push({
                    x: platform.x + Math.random() * (platform.width - 40),
                    y: platform.y - 45,
                    width: 40,
                    height: 45,
                    vx: (Math.random() > 0.5 ? 1 : -1) * (2 + level * 0.5),
                    health: 2 + level,
                    maxHealth: 2 + level,
                    platform: platform,
                    type: Math.random() > 0.7 ? 'flying' : 'ground',
                    shootTimer: 0
                });
            }

            // Spawn coins
            for (let i = 0; i < 10; i++) {
                const platform = platforms[Math.floor(Math.random() * platforms.length)];
                coins.push({
                    x: platform.x + Math.random() * (platform.width - 30),
                    y: platform.y - 40,
                    width: 30,
                    height: 30,
                    collected: false,
                    rotation: 0
                });
            }

            // Boss at level 3, 6, 9, etc
            if (level % 3 === 0) {
                boss = {
                    x: 1000,
                    y: 500,
                    width: 80,
                    height: 100,
                    health: 50 + level * 10,
                    maxHealth: 50 + level * 10,
                    vx: -2,
                    phase: 1,
                    shootTimer: 0,
                    pattern: 0
                };
            }

            document.getElementById('levelNum').textContent = level;
        }

        function attack() {
            if (player.attackTimer > 0) return;

            player.attacking = true;
            player.attackTimer = upgrades.attackSpeed.purchased ? 15 : 30;

            const damage = upgrades.strongerAttack.purchased ? 3 : 2;

            // Check enemy hits
            enemies.forEach((enemy, i) => {
                const attackRange = 60;
                const inRange = player.facing === 1 ?
                    enemy.x < player.x + attackRange && enemy.x > player.x :
                    enemy.x + enemy.width > player.x - attackRange && enemy.x < player.x;

                if (inRange && Math.abs(enemy.y - player.y) < 60) {
                    enemy.health -= damage;
                    createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff0000', 10);

                    if (enemy.health <= 0) {
                        enemies.splice(i, 1);
                        kills++;
                        score += 100;
                        spawnCoin(enemy.x + enemy.width / 2, enemy.y);
                        updateHUD();
                    }
                }
            });

            // Check boss hit
            if (boss) {
                const attackRange = 80;
                const inRange = player.facing === 1 ?
                    boss.x < player.x + attackRange && boss.x > player.x :
                    boss.x + boss.width > player.x - attackRange && boss.x < player.x;

                if (inRange && Math.abs(boss.y - player.y) < 120) {
                    boss.health -= damage;
                    createParticles(boss.x + boss.width / 2, boss.y + boss.height / 2, '#ff00ff', 15);

                    if (boss.health <= 0) {
                        createParticles(boss.x + boss.width / 2, boss.y + boss.height / 2, '#ffd700', 50);
                        score += 1000;
                        for (let i = 0; i < 10; i++) {
                            spawnCoin(boss.x + boss.width / 2 + (Math.random() - 0.5) * 100, boss.y + boss.height / 2);
                        }
                        boss = null;
                        updateHUD();
                    }
                }
            }

            setTimeout(() => { player.attacking = false; }, 200);
        }

        function spawnCoin(x, y) {
            coins.push({
                x: x - 15,
                y: y - 15,
                width: 30,
                height: 30,
                collected: false,
                rotation: 0,
                vy: -5,
                gravity: 0.5
            });
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    size: Math.random() * 5 + 2,
                    color,
                    life: 30
                });
            }
        }

        function updatePlayer() {
            // Movement
            if (keys.ArrowLeft) {
                player.vx = -player.speed;
                player.facing = -1;
            } else if (keys.ArrowRight) {
                player.vx = player.speed;
                player.facing = 1;
            } else {
                player.vx = 0;
            }

            // Jump
            if (keys.ArrowUp && player.onGround) {
                player.vy = -player.jumpPower;
                player.onGround = false;
                player.canDoubleJump = player.hasDoubleJump;
            } else if (keys.ArrowUp && player.canDoubleJump && !player.onGround && player.vy > 0) {
                player.vy = -player.jumpPower;
                player.canDoubleJump = false;
                createParticles(player.x + player.width / 2, player.y + player.height, '#00ffff', 10);
            }

            // Physics
            player.vy += 0.8; // Gravity
            player.x += player.vx;
            player.y += player.vy;

            // Platform collisions
            player.onGround = false;
            platforms.forEach(platform => {
                if (player.x + player.width > platform.x &&
                    player.x < platform.x + platform.width &&
                    player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + 20 &&
                    player.vy > 0) {
                    player.y = platform.y - player.height;
                    player.vy = 0;
                    player.onGround = true;
                }
            });

            // Bounds
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            if (player.y > canvas.height) {
                player.health = 0;
            }

            // Timers
            if (player.attackTimer > 0) player.attackTimer--;
            if (player.invincibleTimer > 0) {
                player.invincibleTimer--;
                if (player.invincibleTimer === 0) player.invincible = false;
            }
        }

        function updateEnemies() {
            enemies.forEach((enemy, i) => {
                if (enemy.type === 'ground') {
                    enemy.x += enemy.vx;

                    // Turn around at platform edges
                    if (enemy.x < enemy.platform.x || enemy.x + enemy.width > enemy.platform.x + enemy.platform.width) {
                        enemy.vx *= -1;
                    }

                    // Keep on platform
                    enemy.y = enemy.platform.y - enemy.height;
                } else {
                    // Flying enemy
                    enemy.shootTimer++;
                    if (enemy.shootTimer > 120) {
                        enemy.shootTimer = 0;
                        projectiles.push({
                            x: enemy.x + enemy.width / 2,
                            y: enemy.y + enemy.height / 2,
                            width: 10,
                            height: 10,
                            vx: player.x > enemy.x ? 5 : -5,
                            vy: (player.y - enemy.y) * 0.05,
                            color: '#ff00ff'
                        });
                    }

                    // Float around
                    enemy.x += enemy.vx;
                    enemy.y += Math.sin(Date.now() / 500 + i) * 2;

                    if (enemy.x < 50 || enemy.x > canvas.width - 50) enemy.vx *= -1;
                }

                // Check collision with player
                if (!player.invincible &&
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y) {
                    damagePlayer(10);
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0000', 15);
                }
            });

            // Update boss
            if (boss) {
                boss.x += boss.vx;
                if (boss.x < 600 || boss.x > 1100) boss.vx *= -1;

                boss.shootTimer++;
                if (boss.shootTimer > 60) {
                    boss.shootTimer = 0;
                    boss.pattern = (boss.pattern + 1) % 3;

                    if (boss.pattern === 0) {
                        // Triple shot
                        for (let i = -1; i <= 1; i++) {
                            projectiles.push({
                                x: boss.x + boss.width / 2,
                                y: boss.y + boss.height / 2,
                                width: 15,
                                height: 15,
                                vx: -6,
                                vy: i * 3,
                                color: '#ff00ff'
                            });
                        }
                    } else if (boss.pattern === 1) {
                        // Spread shot
                        for (let i = 0; i < 5; i++) {
                            const angle = (Math.PI / 4) * i - Math.PI / 2;
                            projectiles.push({
                                x: boss.x + boss.width / 2,
                                y: boss.y + boss.height / 2,
                                width: 12,
                                height: 12,
                                vx: Math.cos(angle) * 5,
                                vy: Math.sin(angle) * 5,
                                color: '#ffff00'
                            });
                        }
                    }
                }

                // Boss collision with player
                if (!player.invincible &&
                    player.x < boss.x + boss.width &&
                    player.x + player.width > boss.x &&
                    player.y < boss.y + boss.height &&
                    player.y + player.height > boss.y) {
                    damagePlayer(20);
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0000', 20);
                }
            }

            // Update projectiles
            projectiles.forEach((proj, i) => {
                proj.x += proj.vx;
                proj.y += proj.vy;

                if (proj.x < 0 || proj.x > canvas.width || proj.y < 0 || proj.y > canvas.height) {
                    projectiles.splice(i, 1);
                    return;
                }

                // Hit player
                if (!player.invincible &&
                    player.x < proj.x + proj.width &&
                    player.x + player.width > proj.x &&
                    player.y < proj.y + proj.height &&
                    player.y + player.height > proj.y) {
                    damagePlayer(5);
                    projectiles.splice(i, 1);
                    createParticles(proj.x, proj.y, proj.color, 8);
                }
            });
        }

        function damagePlayer(amount) {
            player.health -= amount;
            player.invincible = true;
            player.invincibleTimer = 60;
            updateHUD();

            if (player.health <= 0) {
                gameOver();
            }
        }

        function updateCoins() {
            coins.forEach((coin, i) => {
                if (!coin.collected) {
                    coin.rotation += 0.1;

                    if (coin.vy !== undefined) {
                        coin.vy += coin.gravity;
                        coin.y += coin.vy;

                        platforms.forEach(platform => {
                            if (coin.y + coin.height > platform.y &&
                                coin.y < platform.y + 20 &&
                                coin.x + coin.width > platform.x &&
                                coin.x < platform.x + platform.width) {
                                coin.y = platform.y - coin.height;
                                coin.vy = 0;
                                delete coin.gravity;
                            }
                        });
                    }

                    if (player.x < coin.x + coin.width &&
                        player.x + player.width > coin.x &&
                        player.y < coin.y + coin.height &&
                        player.y + player.height > coin.y) {
                        coin.collected = true;
                        totalCoins++;
                        score += 10;
                        localStorage.setItem('totalCoins', totalCoins);
                        updateHUD();
                        createParticles(coin.x + coin.width / 2, coin.y + coin.height / 2, '#ffd700', 10);
                    }
                }
            });
        }

        function updateParticles() {
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life--;

                if (p.life <= 0) particles.splice(i, 1);
            });
        }

        function draw() {
            // Sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a1a');
            gradient.addColorStop(1, '#1a1a3a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = 'white';
            for (let i = 0; i < 50; i++) {
                const x = (i * 123) % canvas.width;
                const y = (i * 456) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }

            // Platforms
            platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                ctx.fillStyle = '#1a8c57';
                ctx.fillRect(platform.x, platform.y, platform.width, 5);
            });

            // Coins
            coins.forEach(coin => {
                if (!coin.collected) {
                    ctx.save();
                    ctx.translate(coin.x + coin.width / 2, coin.y + coin.height / 2);
                    ctx.rotate(coin.rotation);
                    const scale = Math.abs(Math.cos(coin.rotation));
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(-coin.width / 2 * scale, -coin.height / 2, coin.width * scale, coin.height);
                    ctx.fillStyle = '#ffed4e';
                    ctx.fillRect(-8 * scale, -10, 16 * scale, 8);
                    ctx.restore();
                }
            });

            // Player
            const flashPlayer = player.invincible && Math.floor(Date.now() / 100) % 2;
            if (!flashPlayer) {
                ctx.fillStyle = player.attacking ? '#ff0000' : '#00ffff';
                ctx.fillRect(player.x, player.y, player.width, player.height);

                // Face
                ctx.fillStyle = '#fff';
                const eyeX = player.facing === 1 ? player.x + 25 : player.x + 8;
                ctx.fillRect(eyeX, player.y + 10, 8, 8);

                // Weapon
                if (player.attacking) {
                    ctx.fillStyle = '#ffffff';
                    const weaponX = player.facing === 1 ? player.x + player.width : player.x - 30;
                    ctx.fillRect(weaponX, player.y + 20, 30, 8);
                }
            }

            // Enemies
            enemies.forEach(enemy => {
                if (enemy.type === 'ground') {
                    ctx.fillStyle = '#ff6b6b';
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(enemy.x + 8, enemy.y + 10, 8, 8);
                    ctx.fillRect(enemy.x + 24, enemy.y + 10, 8, 8);
                } else {
                    ctx.fillStyle = '#9b59b6';
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(enemy.x + 8, enemy.y + 10, 8, 8);
                    ctx.fillRect(enemy.x + 24, enemy.y + 10, 8, 8);
                    // Wings
                    ctx.fillStyle = '#8e44ad';
                    ctx.fillRect(enemy.x - 10, enemy.y + 15, 15, 5);
                    ctx.fillRect(enemy.x + enemy.width - 5, enemy.y + 15, 15, 5);
                }

                // Health bar
                const healthPercent = enemy.health / enemy.maxHealth;
                ctx.fillStyle = '#333';
                ctx.fillRect(enemy.x, enemy.y - 10, enemy.width, 5);
                ctx.fillStyle = healthPercent > 0.5 ? '#00ff00' : '#ff0000';
                ctx.fillRect(enemy.x, enemy.y - 10, enemy.width * healthPercent, 5);
            });

            // Boss
            if (boss) {
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(boss.x, boss.y, boss.width, boss.height);

                // Details
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(boss.x + 10, boss.y + 10, boss.width - 20, boss.height - 20);

                // Eyes
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(boss.x + 15, boss.y + 25, 15, 15);
                ctx.fillRect(boss.x + 50, boss.y + 25, 15, 15);

                // Boss health bar
                const bossHealthPercent = boss.health / boss.maxHealth;
                ctx.fillStyle = '#333';
                ctx.fillRect(boss.x, boss.y - 20, boss.width, 10);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(boss.x, boss.y - 20, boss.width * bossHealthPercent, 10);
            }

            // Projectiles
            projectiles.forEach(proj => {
                ctx.fillStyle = proj.color;
                ctx.fillRect(proj.x, proj.y, proj.width, proj.height);
                ctx.fillStyle = '#fff';
                ctx.fillRect(proj.x + 3, proj.y + 3, proj.width - 6, proj.height - 6);
            });

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1;
            });
        }

        function updateHUD() {
            document.getElementById('health').textContent = Math.max(0, player.health);
            document.getElementById('healthBar').style.width = (player.health / player.maxHealth * 100) + '%';
            document.getElementById('coins').textContent = totalCoins;
            document.getElementById('score').textContent = score;
            document.getElementById('kills').textContent = kills;
        }

        function checkLevelComplete() {
            if (enemies.length === 0 && !boss) {
                gameRunning = false;
                document.getElementById('levelStats').innerHTML = `
                    Score: ${score}<br>
                    Kills: ${kills}<br>
                    Coins Collected: ${totalCoins}
                `;
                document.getElementById('level-complete').classList.add('active');
            }
        }

        function nextLevel() {
            currentLevel++;
            document.getElementById('level-complete').classList.remove('active');
            loadLevel(currentLevel);
            gameRunning = true;
        }

        function gameOver() {
            gameRunning = false;
            setTimeout(() => {
                alert(`GAME OVER!\n\nLevel Reached: ${currentLevel}\nFinal Score: ${score}\nKills: ${kills}`);
                document.getElementById('menu').classList.remove('hidden');
            }, 100);
        }

        function showUpgradeShop() {
            renderUpgradeShop();
            document.getElementById('upgrade-shop').classList.add('active');
        }

        function closeUpgradeShop() {
            document.getElementById('upgrade-shop').classList.remove('active');
        }

        function toggleUpgradeShop() {
            const shop = document.getElementById('upgrade-shop');
            if (shop.classList.contains('active')) {
                closeUpgradeShop();
            } else {
                showUpgradeShop();
            }
        }

        function renderUpgradeShop() {
            const grid = document.getElementById('upgradeGrid');
            grid.innerHTML = '';

            Object.keys(upgrades).forEach(key => {
                const upgrade = upgrades[key];
                const div = document.createElement('div');
                div.className = 'upgrade-item' + (upgrade.purchased ? ' purchased' : '');
                div.innerHTML = `
                    <div class="upgrade-name">${upgrade.name}</div>
                    <div class="upgrade-cost">${upgrade.purchased ? '✓ OWNED' : `💰 ${upgrade.cost} Coins`}</div>
                `;

                if (!upgrade.purchased) {
                    div.onclick = () => purchaseUpgrade(key);
                }

                grid.appendChild(div);
            });

            grid.innerHTML += `<div style="grid-column: 1/-1; text-align: center; font-size: 24px; color: #ffd700; padding: 20px;">Your Coins: ${totalCoins}</div>`;
        }

        function purchaseUpgrade(key) {
            const upgrade = upgrades[key];
            if (upgrade.purchased) return;
            if (totalCoins < upgrade.cost) {
                alert('Not enough coins!');
                return;
            }

            totalCoins -= upgrade.cost;
            upgrade.purchased = true;
            if (upgrade.apply) upgrade.apply();

            localStorage.setItem('totalCoins', totalCoins);
            localStorage.setItem('upgrades', JSON.stringify(upgrades));

            renderUpgradeShop();
            updateHUD();
        }

        function gameLoop() {
            if (!gameRunning) return;

            updatePlayer();
            updateEnemies();
            updateCoins();
            updateParticles();
            checkLevelComplete();

            draw();
            requestAnimationFrame(gameLoop);
        }

        updateHUD();
    </script>
</body>
</html>
